; Vectrex for VectorPie: the settings that come with the program.
; Your own go into save/vectrex.ini (every game) and save/games/<game>.ini (one game: only what
; differs for it); what stands there wins. The options menu (Tab or F2) writes them.

; The cabinet's tube: horizontal (4:3 lying: the Vectrex's standing picture with borders left and
; right) or vertical (3:4 standing)
monitor = horizontal
; The picture: 1.0 as large as the tube allows with the Vectrex's own shape; size_x / size_y
; stretch it on top; pos_x / pos_y move it (board units, the tube is 0..4095)
size = 1.000
size_x = 1.000
size_y = 1.000
pos_x = 0
pos_y = 0
flip_x = 0
flip_y = 0
; The lines' level: brightness (0..2), and how the Vectrex's 128 steps become it (level = (z/127)^gamma)
brightness = 1.00
gamma = 0.80
; The lines' colour without a colour profile
color_r = 255
color_g = 255
color_b = 255
; Frames a second to the vector board (the Vectrex draws 50)
board_hz = 50

; 1: the BIOS's intro (the VECTREX logo and its tune) runs unseen, the game starts at once, in the
; same state as after the intro
skip_bios = 0

; UVMC2 games: 1 Fast (the cartridge's vector lists handed to the console by the emulator; the
; console stays cycle-exact, the cartridge's own timing is approximated), 0 Exact (every cycle of
; the cartridge's RP2350: too slow for most UVMC2 games on a Raspberry Pi 5)
uvmc2_fast = 1

; Digital controls (keys, a joystick's directions) as the Vectrex's analog stick: out to dig_max
; (0..1) in dig_attack seconds while held, back to the middle in dig_release seconds; dig_curve the
; ramp's shape (1 straight, 2 slow at first, 0.5 fast at first). 0 seconds: at once, as a switch.
dig_attack = 0.12
dig_release = 0.08
dig_curve = 1.0
dig_max = 1.0
; An analog stick's dead zone (0..1)
deadzone = 0.15

volume = 1.00

; The cartridges: the game list shows every Vectrex ROM (.bin .vec .gam .rom), UVMC2 game (.um2)
; and PiTrex program (.pit) in these folders: rom_dir (your own, if set), then
; /persistent/games/rom/vectrex (kept through VectorPie's updates), then
; /usr/local/share/advance/image/vectrex, then roms/ next to the program
rom_dir =
