; Mine Storm (the console's own game, in the BIOS ROM): its colour profile (src/render/colors.h).
; name = CONDITIONS : RRGGBB [*GAIN], the first rule that matches a line gives its colour.
; Found with vxtest --tags (2026-11-08): the 6809's X (the vector list), PC (the routine) and U (the
; object being drawn: $CB2B is the player's ship, whatever it draws - the ship itself, its explosion
; and its hyperspace jump; $C900-$C92F the shots; from $C933 the mines and mine seeds).

ship      = u CB2B-CB2B : 00C8FF                ; the player's ship, its explosion and its hyperspace jump
lives     = x EEF0-EF0F : 00C8FF                ; the ships left, bottom right
shots     = pc F2C0-F2DF u C900-C92F : FFFFFF   ; the ship's shots (dots)
seeds     = pc F2C0-F2DF u C930-CB7F : FF5050 *1.6   ; the mine seeds (dots), brighter than the mines
mines     = x EE40-EE7F : FF3030                ; the mines (all four kinds)
minelayer = x EF10-EFFF : FF9020                ; the minelayer at the start of a field
score     = x F9D0-FBFF : FFFFFF                ; the score and the texts (the BIOS font)
